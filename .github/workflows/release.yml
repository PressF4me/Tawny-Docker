name: release

# Build and push the Tawny container to GHCR.
#   - push a tag  vX.Y.Z   → publishes ghcr.io/pressf4me/tawny:X.Y.Z, :X.Y, :latest
#   - manual run           → publishes :edge from the chosen ref
#
# Auth is the built-in GITHUB_TOKEN (no PAT). Because this workflow lives in
# pressf4me/Tawny-Docker and the Dockerfile carries
# org.opencontainers.image.source=…/pressf4me/Tawny-Docker, the package publishes
# connected to this repo — not orphaned.
#
# The image name is fixed, not taken from the repo name: the repo was renamed
# from `tawny` to `Tawny-Docker`, and every install pulls ghcr.io/pressf4me/tawny.
#
# Every action is pinned to a commit, not a tag: a tag can be moved to different
# code by whoever controls (or has stolen) the action's repo, and this job holds
# a token that can publish the image everyone pulls. To update one, resolve the
# new tag to its commit (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`)
# and keep the tag in the trailing comment.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pressf4me/tawny

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
