<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA8CE"/>
      <stop offset="1" stop-color="#3B6A92"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCA55E"/>
      <stop offset="1" stop-color="#B26F31"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#sky)"/>
  <g transform="translate(54 54) scale(0.965) translate(-54 -54)">

  <!-- body + ear tufts, one silhouette -->
  <path fill="url(#feather)" d="
    M37,36
    C 34.5,29 34.5,24.5 37.5,25.6  C 40.5,26.7 43,29.5 45.5,31.7
    C 48.4,30.2 59.6,30.2 62.5,31.7
    C 65,29.5 67.5,26.7 70.5,25.6  C 73.5,24.5 73.5,29 71,36
    C 79,42.5 83.5,52 83.5,61.5
    C 83.5,77 70.5,86.5 54,86.5
    C 37.5,86.5 24.5,77 24.5,61.5
    C 24.5,52 29,42.5 37,36 Z"/>

  <!-- belly -->
  <path fill="#EFD9B4" d="M54,54 C 66.5,54 73,63.5 73,72 C 73,80.5 64.5,86.4 54,86.4 C 43.5,86.4 35,80.5 35,72 C 35,63.5 41.5,54 54,54 Z"/>

  <!-- facial disc: the rim is what makes it read as an owl rather than a face -->
  <path fill="#F7EAD6" stroke="#A0641F" stroke-width="1.6" d="
    M54,34.5
    C 63,34.5 72,40 72,49.5 C 72,58 65,63.5 54,63.5
    C 43,63.5 36,58 36,49.5 C 36,40 45,34.5 54,34.5 Z"/>

  <!-- eyes -->
  <circle cx="44.6" cy="49.5" r="8" fill="#2E2318"/>
  <circle cx="63.4" cy="49.5" r="8" fill="#2E2318"/>
  <circle cx="42" cy="46.7" r="2.7" fill="#FFFFFF"/>
  <circle cx="60.8" cy="46.7" r="2.7" fill="#FFFFFF"/>

  <!-- beak, hooked -->
  <path fill="#E89B33" d="M54,55.4 L 58.6,59.4 C 58.6,63.8 49.4,63.8 49.4,59.4 Z"/>

  <!-- folded wings -->
  <path fill="none" stroke="#9E6029" stroke-width="2.6" stroke-linecap="round" opacity=".8"
        d="M30.5,57 C 29.5,68 31.5,76 36,80.5"/>
  <path fill="none" stroke="#9E6029" stroke-width="2.6" stroke-linecap="round" opacity=".8"
        d="M77.5,57 C 78.5,68 76.5,76 72,80.5"/>
  </g>
</svg>
